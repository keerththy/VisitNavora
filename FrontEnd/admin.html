<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <title>Admin Dashboard - VisitNavora</title>

    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo">
            <img src="images/VisitNavora logo.jfif">
            <h2>VisitNavora</h2>
        </div>

        <nav>
            <a href="#" class="active">
                <i class="fas fa-th-large"></i> Dashboard
            </a>

            <a href="HomePage.html">
                <i class="fas fa-home"></i> Home
            </a>

            <a href="places.html">
                <i class="fas fa-map-marker-alt"></i> Places
            </a>

            <a href="DayPlan.html">
                <i class="fas fa-calendar-day"></i> Plan Your day
            </a>

            <a href="map.html">
                <i class="fas fa-map"></i> Map
            </a>
        </nav>
    </aside>

    <main class="content">

        <div class="topbar">
            <div class="mobile-brand-banner">
                <img src="images/VisitNavora logo.jfif" alt="VisitNavora Logo">
                <h2>VisitNavora</h2>
            </div>

            <h1 id="welcomeText">Welcome back, Admin 👋</h1>
            
            <div class="top-btns">
                <button class="add-btn">+ Add Place</button>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <div class="table-box">
            <h2>Manage Places</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Place Name</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="adminList">
                    </tbody>
            </table>
        </div>

    </main>

</div>

<div id="placeModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle">Add New Place</h2>
        
        <div class="step-indicator">
            <div class="step-dot active" id="dot1">1</div>
            <div class="step-line" id="stepLine"></div>
            <div class="step-dot" id="dot2">2</div>
        </div>

        <form id="placeForm">
            <input type="hidden" id="editId">
            
            <div class="form-step active" id="step1">
                <input type="text" id="pName" placeholder="Place Name" required>
                <input type="text" id="pCategory" placeholder="Category (e.g. Temple, Beach)" required>
                <input type="text" id="pImage" placeholder="Main Image Path (e.g. images/temple.jpg)" required>
                <textarea id="pDesc" placeholder="Description Paragraph" rows="3" required></textarea>
                
                <button type="button" class="next-btn" onclick="goToStep(2)">
                    Next <i class="fas fa-arrow-right"></i>
                </button>
            </div>

            <div class="form-step" id="step2">
                <input type="text" id="pSuitable" placeholder="Suitable For (Family, Friends)">
                <input type="text" id="pBestTime" placeholder="Best Time To Visit">
                <input type="number" id="pDuration" placeholder="Duration (hours)">
                <input type="number" id="pPriority" placeholder="Priority (1-10)">
                <div class="coords">
                    <input type="number" step="any" id="pLat" placeholder="Latitude" required>
                    <input type="number" step="any" id="pLng" placeholder="Longitude" required>
                </div>
                
                <div class="step-actions">
                    <button type="button" class="back-btn" onclick="goToStep(1)">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                    <button type="submit" class="save-btn" id="submitFormBtn">Save Place</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="admin.js"></script>

</body>
</html>
